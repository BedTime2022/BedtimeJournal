        <style>
            html, body {
                height: auto;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: 'IBM Plex Mono', monospace;
                font-size: 20px;
                background: #000000;
            }

            #header-bg {
                background-color: #030303;

                display: flex;

            }
            h1, h2 {

                color: #fff;
                text-shadow: 2px 2px 0 #785f8d, 4px 4px 8px #0006;
                margin-top: 0;
                letter-spacing: 2px;
            }
            h1 {
                margin-top: -5px;
            }
            p, li {
                display: inline-block;
                background: rgba(255,255,255,0.7);
                color: #8a2497;
                padding: 8px 16px;
                border-radius: 12px;
                margin-bottom: 10px;
                border: 2px solid #785f8d;
                font-family: 'Indie Flower', cursive, sans-serif;
                box-shadow: 2px 2px 0 #f3d1bf;
            }

            ul {
                padding-left: 0;
                list-style: none;
            }

            a {
                color: #c6a9df;
                text-decoration: none;
                font-weight: bold;
                border-bottom: 2px dashed #785f8d;
                transition: background 0.2s, color 0.2s;
                padding: 2px 4px;
                border-radius: 4px;
            }
            a:hover {
                background: #f3d1bf;
                color: #2d1e2f;
            }

            #nav {
                color: #fff;
                margin-bottom: 1vh;
                margin-top: 20px;
                font-family: 'VT323', monospace;
                font-size: 22px;
            }

            #player {
                position: absolute;
                top: 24px;
                right: 24px;
                margin-bottom: 0;
                text-align: right;
                z-index: 10;
            }

            /* iframe with no scrollbars */
            iframe {
                width: 100%;
                border: none;
                overflow: hidden; /* disable scrollbars */
            }
        </style>
    </head>

    <body>

        <iframe 
            id="contentFrame" 
            name="contentFrame" 
            src="index_content.html">
        </iframe>

        <!-- Auto-resize the iframe to remove scrollbars safely -->
        <script>
            function resizeIframe() {
                var iframe = document.getElementById('contentFrame');
                if (!iframe) return;
                if (!iframe.contentWindow || !iframe.contentWindow.document) return;

                var body = iframe.contentWindow.document.body;
                var html = iframe.contentWindow.document.documentElement;

                var height = Math.max(
                    body.scrollHeight,
                    body.offsetHeight,
                    html.clientHeight,
                    html.scrollHeight,
                    html.offsetHeight
                );

                iframe.style.height = height + "px";
            }

            window.addEventListener("DOMContentLoaded", function () {
                var iframe = document.getElementById("contentFrame");
                if (iframe) iframe.onload = resizeIframe;
            });
        </script>

    </body>
