<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>チャット / Guestbook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/chat/style.css">

  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD03ltXt6iLWC_FgjfQHznOs6VVaxh2Bzk",
      authDomain: "neocities-chat-f1bc7.firebaseapp.com",
      databaseURL: "https://neocities-chat-f1bc7-default-rtdb.firebaseio.com",
      projectId: "neocities-chat-f1bc7",
      storageBucket: "neocities-chat-f1bc7.appspot.com",
      messagingSenderId: "751201092011",
      appId: "1:751201092011:web:d5877c3de9e468892f12ee"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
</head>
<body>
  <h1>チャット / Chat</h1>
  <p>Hello!!! This is the Chat. You can send messages or media links (images, gifs, YouTube). Thanks for visiting!</p>

  <div id="chat" aria-live="polite" aria-atomic="true"></div>

  <div id="controls">
    <input id="user" type="text" placeholder="Your name">
    <input id="text" type="text" placeholder="Your message (or media URL)">
    <button id="send">Post</button>
  </div>

  <script>
    const chatBox = document.getElementById('chat');
    const userInput = document.getElementById('user');
    const textInput = document.getElementById('text');
    const sendBtn = document.getElementById('send');

    // Reference: newest-last in database, limit 200
    const chatRef = firebase.database().ref('guestbook').orderByChild('ts').limitToLast(200);

    /**
     * Build and return a message element.
     * - For plain text messages we set textContent (safe).
     * - For known embed types (images, video, YouTube) we use controlled innerHTML.
     */
    function buildMessageElement(msg) {
      const wrapper = document.createElement('div');
      wrapper.className = 'message';

      // Meta row (user + timestamp)
      const meta = document.createElement('div');
      meta.className = 'meta-row';
      const userSpan = document.createElement('span');
      userSpan.className = 'message-user';
      userSpan.textContent = (msg.user || 'Anonymous') + ':';
      const timeSpan = document.createElement('span');
      timeSpan.className = 'timestamp';
      timeSpan.textContent = new Date(msg.ts).toLocaleString();

      meta.appendChild(userSpan);
      meta.appendChild(timeSpan);
      wrapper.appendChild(meta);

      // Determine content (image / video / youtube / plain text)
      const text = (msg.text || '').trim();
      const contentContainer = document.createElement('div');
      contentContainer.className = 'message-text';

      if (/\.(gif|png|jpe?g)(\?.*)?$/i.test(text)) {
        const img = document.createElement('img');
        img.className = 'chat-image';
        img.src = text;
        img.alt = 'User image';
        contentContainer.appendChild(img);
      }
      else if (/\.(mp4|webm)(\?.*)?$/i.test(text)) {
        const vid = document.createElement('video');
        vid.className = 'chat-video';
        vid.src = text;
        vid.controls = true;
        vid.autoplay = false;
        vid.loop = false;
        contentContainer.appendChild(vid);
      }
      else if (/youtu(?:\.be|be\.com)/.test(text)) {
        const m = text.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
        if (m && m[1]) {
          const id = m[1];
          const iframe = document.createElement('iframe');
          iframe.className = 'chat-iframe';
          iframe.height = 180;
          iframe.src = `https://www.youtube.com/embed/${id}`;
          iframe.frameBorder = 0;
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
          iframe.allowFullscreen = true;
          contentContainer.appendChild(iframe);

          const watchLink = document.createElement('div');
          watchLink.innerHTML = `<a href="https://youtu.be/${id}" target="_blank" style="color:#fff;font-size:0.8rem;">▶ Watch on YouTube</a>`;
          contentContainer.appendChild(watchLink);
        } else {
          // Fallback to text if no id found
          contentContainer.textContent = text;
        }
      }
      else {
        // Plain text: use textContent to avoid HTML injection
        contentContainer.textContent = text;
      }

      wrapper.appendChild(contentContainer);
      return wrapper;
    }

    // When a child is added, prepend it so newest appear at top
    chatRef.on('child_added', snap => {
      const msg = snap.val();
      const el = buildMessageElement(msg);
      // Prepend new message so newest messages are at the top
      chatBox.prepend(el);
      // Optional UX: keep the top visible so latest is obvious
      // If user is scrolled near the top, keep it pinned to top.
      if (chatBox.scrollTop <= 20) {
        chatBox.scrollTop = 0;
      }
    });

    // After the initial load of the current set, scroll to top so newest are visible
    chatRef.once('value', () => {
      // Give the browser a tick to paint the appended nodes
      setTimeout(() => chatBox.scrollTop = 0, 50);
    });

    // Posting logic
    sendBtn.addEventListener('click', () => {
      const user = userInput.value.trim() || 'Anonymous';
      const text = textInput.value.trim();
      if (!text) return;
      firebase.database().ref('guestbook').push({ user, text, ts: Date.now() });
      textInput.value = '';
      textInput.focus();
    });

    textInput.addEventListener('keyup', e => {
      if (e.key === 'Enter') sendBtn.click();
    });

  </script>
</body>
</html>
